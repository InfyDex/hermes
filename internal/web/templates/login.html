<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes - {{ .Title }}</title>
    <link rel="icon" type="image/png" href="/static/hermes.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#c9d1d9;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .login-wrap{width:100%;max-width:400px}
        .login-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:32px}
        .login-header{text-align:center;margin-bottom:24px}
        .login-header img{height:48px;width:48px;margin-bottom:12px}
        .login-header h1{color:#f0f6fc;font-size:24px;margin-bottom:4px}
        .login-header p{color:#8b949e;font-size:14px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:4px;font-size:14px;color:#8b949e}
        .form-group input{width:100%;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:14px;font-family:inherit}
        .form-group input:focus{outline:none;border-color:#58a6ff}
        .password-wrap{position:relative}
        .password-wrap input{padding-right:40px}
        .toggle-password{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#8b949e;cursor:pointer;font-size:16px;padding:4px}
        .toggle-password:hover{color:#f0f6fc}
        .form-check{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:14px;color:#8b949e}
        .form-check input{width:auto}
        .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:10px 16px;border-radius:6px;border:1px solid #2ea043;background:#238636;color:#fff;cursor:pointer;font-size:14px;font-family:inherit}
        .btn:hover{background:#2ea043}
        .alert{background:#490202;border:1px solid #f85149;color:#f85149;padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:16px}
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-header">
                <img src="/static/hermes.png" alt="Hermes">
                <h1>Hermes</h1>
                <p>Self-hosted cron scheduler</p>
            </div>

            {{ if .Error }}
            <div class="alert">{{ .Error }}</div>
            {{ end }}

            <form method="POST" action="/login">
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                <input type="hidden" name="next" value="{{ .Next }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ .Username }}" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">&#128065;</button>
                    </div>
                </div>
                <label class="form-check">
                    <input type="checkbox" name="remember" value="on">
                    Remember me
                </label>
                <button type="submit" class="btn">Sign in</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });
    </script>
</body>
</html>
